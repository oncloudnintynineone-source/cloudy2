<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D47A1" />
    <title>Cloudy</title>
    <style>
      :root {
        --navy: #0d47a1;
        --bg: #111111;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: #e0e0e0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      header {
        background: var(--navy);
        color: white;
        padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header svg { flex-shrink: 0; }
      header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.02em; }
      main { flex: 1; padding: 12px 16px 32px; overflow: hidden; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .sk { background: #2c2e33; border-radius: 6px; }
      @media (prefers-reduced-motion: no-preference) {
        .sk-pulse { animation: c2-pulse 1.4s ease-in-out infinite; }
        @keyframes c2-pulse {
          0%, 100% { opacity: 0.55; }
          50% { opacity: 1; }
        }
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        padding: 10px 0;
        border-bottom: 1px solid #2c2e33;
      }
      .tabs .sk { height: 28px; margin: 0 auto; width: 55%; }
      .nav { display: flex; align-items: center; gap: 10px; padding: 14px 0; }
      .nav .sk:nth-child(1),
      .nav .sk:nth-child(3) {
        width: 43px;
        height: 43px;
        border-radius: 10px;
        flex-shrink: 0;
      }
      .nav .sk:nth-child(2) { flex: 1; height: 24px; }
      .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }
      .week .sk { height: 14px; width: 70%; margin: 0 auto; }
      .grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 54px; gap: 4px; }
      .grid .sk { height: 100%; border-radius: 4px; }
    </style>
  </head>
  <body>
    <header>
      <!-- Inline brand mark: cloud + calendar, no external asset -->
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M8 18a4 4 0 01-.7-7.92A5.5 5.5 0 0118 8.5 4 4 0 0122 18H8z" fill="white" opacity="0.95" />
        <rect x="7" y="11" width="14" height="10" rx="2" fill="#0D47A1" stroke="white" stroke-width="1.2" />
        <path d="M10 11V9M18 11V9M7 14h14" stroke="white" stroke-width="1.2" stroke-linecap="round" />
      </svg>
      <h1>Cloudy</h1>
    </header>
    <div class="sr-only" role="status">Loading Cloudy…</div>
    <main aria-hidden="true">
      <div class="tabs">
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span>
      </div>
      <div class="nav">
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
      </div>
      <div class="week">
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span>
      </div>
      <div class="grid">
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
      </div>
    </main>
    <script>
      // Served by the service worker for a cold launch (start URL `/` when the
      // newest saved view is stale). Fetch the real start URL in the background
      // — which also warms the serverless function + Neon compute — then
      // replace with the resolved page. Offline, fall back to the last-saved
      // view (injected by the SW as window.__C2_LAUNCH__.fallbackUrl).
      (function () {
        var fallbackUrl = (window.__C2_LAUNCH__ && window.__C2_LAUNCH__.fallbackUrl) || null;
        var attempts = 0;
        var MAX_ATTEMPTS = 4;
        function retry() {
          attempts += 1;
          if (attempts > MAX_ATTEMPTS) {
            location.replace(fallbackUrl || "/offline.html");
            return;
          }
          setTimeout(run, Math.min(1000 * Math.pow(2, attempts), 8000));
        }
        function run() {
          fetch(location.href, { cache: "no-store" })
            .then(function (res) {
              if (res.ok || res.redirected) {
                location.replace(res.url);
              } else {
                retry();
              }
            })
            .catch(retry);
        }
        run();
      })();
    </script>
    <noscript>
      <p style="padding: 24px; text-align: center; color: #b0b0b0">
        Cloudy needs JavaScript to load. <a href="/" style="color: #8ca8e2">Reload</a>.
      </p>
    </noscript>
  </body>
</html>
