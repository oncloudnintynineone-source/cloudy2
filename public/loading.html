<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D47A1" />
    <title>Cloudy</title>
    <style>
      :root {
        --navy: #0d47a1;
        --bg: #111111;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: #e0e0e0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      header {
        background: var(--navy);
        color: white;
        padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header svg { flex-shrink: 0; }
      header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.02em; }
      main { flex: 1; padding: 12px 16px 32px; overflow: hidden; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .sk { background: #2c2e33; border-radius: 6px; }
      @media (prefers-reduced-motion: no-preference) {
        .sk-pulse { animation: c2-pulse 1.4s ease-in-out infinite; }
        @keyframes c2-pulse {
          0%, 100% { opacity: 0.55; }
          50% { opacity: 1; }
        }
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        padding: 10px 0;
        border-bottom: 1px solid #2c2e33;
      }
      .tabs .sk { height: 28px; margin: 0 auto; width: 55%; }
      .nav { display: flex; align-items: center; gap: 10px; padding: 14px 0; }
      .nav .sk:nth-child(1),
      .nav .sk:nth-child(3) {
        width: 43px;
        height: 43px;
        border-radius: 10px;
        flex-shrink: 0;
      }
      .nav .sk:nth-child(2) { flex: 1; height: 24px; }
      .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }
      .week .sk { height: 14px; width: 70%; margin: 0 auto; }
      .grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 54px; gap: 4px; }
      .grid .sk { height: 100%; border-radius: 4px; }
    </style>
  </head>
  <body>
    <header>
      <!-- Inline brand mark: cloud + calendar, no external asset -->
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M8 18a4 4 0 01-.7-7.92A5.5 5.5 0 0118 8.5 4 4 0 0122 18H8z" fill="white" opacity="0.95" />
        <rect x="7" y="11" width="14" height="10" rx="2" fill="#0D47A1" stroke="white" stroke-width="1.2" />
        <path d="M10 11V9M18 11V9M7 14h14" stroke="white" stroke-width="1.2" stroke-linecap="round" />
      </svg>
      <h1>Cloudy</h1>
    </header>
    <div class="sr-only" role="status">Loading Cloudy…</div>
    <main aria-hidden="true">
      <div class="tabs">
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span>
      </div>
      <div class="nav">
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
      </div>
      <div class="week">
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span>
      </div>
      <div class="grid">
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
        <span class="sk sk-pulse"></span><span class="sk sk-pulse"></span><span class="sk sk-pulse"></span>
      </div>
    </main>
    <!--
      Launch targets the inline script is allowed to resolve to. Mirrors
      BASE_PAGES + SETTINGS_SUBTABS in src/lib/ui/uiState.ts; the drift is
      guarded by src/lib/pwa/launchShell.test.ts, which parses this block and
      compares it against those constants. This list only has to be *safe*, not
      authoritative — /settings/* is still enforced server-side by
      requireAdmin(), so an over-permissive entry costs at most one redirect.
    -->
    <script type="application/json" id="c2-launch-routes">
      [
        "/dashboard",
        "/parade-state",
        "/contacts",
        "/settings/users",
        "/settings/departments",
        "/settings/event-types",
        "/settings/templates",
        "/settings/general",
        "/settings/audit-log"
      ]
    </script>
    <script>
      // The service worker serves this page for every launch (start URL `/`),
      // straight from the precache, so the Android splash lifts on this page's
      // first paint instead of waiting on a serverless cold boot. We then
      // resolve the remembered last page *on the client* — the `cloudy2.ui`
      // cookie is client-owned and readable — and replace, so the launch never
      // costs a server round trip for `/` at all.
      //
      // The redirect is deliberately deferred by two animation frames: the
      // parser can otherwise reach this script before the browser has presented
      // a frame, and navigating away pre-paint means the splash never lifts —
      // which is precisely the bug this page exists to fix. Two frames because
      // the first rAF fires *before* the paint it schedules; the second runs
      // after that frame has been presented.
      (function () {
        var DEFAULT_TARGET = "/dashboard";

        function allowedRoutes() {
          try {
            return JSON.parse(document.getElementById("c2-launch-routes").textContent);
          } catch (err) {
            return [];
          }
        }

        // Mirrors fromBase64Url + decodeUiState in src/lib/ui/uiState.ts.
        function readLastPage() {
          try {
            var match = /(?:^|;\s*)cloudy2\.ui=([^;]*)/.exec(document.cookie);
            if (!match) return null;
            var b64 = decodeURIComponent(match[1]).replace(/-/g, "+").replace(/_/g, "/");
            while (b64.length % 4 !== 0) b64 += "=";
            var json = new TextDecoder().decode(
              Uint8Array.from(atob(b64), function (ch) {
                return ch.charCodeAt(0);
              }),
            );
            var page = JSON.parse(json).lastPage;
            return typeof page === "string" ? page : null;
          } catch (err) {
            return null;
          }
        }

        function resolveTarget() {
          var page = readLastPage();
          if (!page) return DEFAULT_TARGET;
          // "/settings" alone is a tab group, not a route — send it to the
          // first sub-tab, matching resolveLaunchTarget.
          if (page === "/settings") return "/settings/users";
          return allowedRoutes().indexOf(page) === -1 ? DEFAULT_TARGET : page;
        }

        var target = resolveTarget();
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            location.replace(target);
          });
        });
      })();
    </script>
    <noscript>
      <p style="padding: 24px; text-align: center; color: #b0b0b0">
        Cloudy needs JavaScript to load.
        <a href="/dashboard" style="color: #8ca8e2">Continue</a>.
      </p>
    </noscript>
  </body>
</html>
