<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>Cloudy2</title>
    <script>
      // Apply Mantine's manual color-scheme override before first paint: the
      // app stores the profile menu's theme choice ("light"/"dark") under this
      // key; with "auto" (or nothing) the CSS prefers-color-scheme rules below
      // decide, matching the app's defaultColorScheme="auto".
      (function () {
        try {
          var scheme = localStorage.getItem("mantine-color-scheme-value");
          if (scheme === "light" || scheme === "dark") {
            document.documentElement.setAttribute("data-c2-scheme", scheme);
          }
        } catch (err) {}
      })();
    </script>
    <style>
      /*
       * Launch shell — the PWA cold start's first paint. The app's dashboard
       * views are now on-demand tabs whose renderer kind is only known after
       * the server resolves the active tab, so this shell cannot shape its
       * skeleton to the arriving view. It renders one neutral full-page block
       * instead, matching the route-level loading.tsx plain box — the handoff
       * reads as one continuous loading surface whatever page the launch
       * redirects to (dashboard/parade/contacts/settings all arrive under the
       * same header chrome).
       *
       * Colors (Mantine v9 defaults):
       *   light: body #fff · skeleton gray-3 #dee2e6 · border gray-4 #ced4da
       *   dark:  body dark-7 #242424 · skeleton + border dark-4 #424242
       */
      :root {
        --c2-body: #ffffff;
        --c2-sk: #dee2e6;
        --c2-border: #ced4da;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c2-body: #242424;
          --c2-sk: #424242;
          --c2-border: #424242;
        }
      }
      :root[data-c2-scheme="dark"] {
        --c2-body: #242424;
        --c2-sk: #424242;
        --c2-border: #424242;
      }
      :root[data-c2-scheme="light"] {
        --c2-body: #ffffff;
        --c2-sk: #dee2e6;
        --c2-border: #ced4da;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, sans-serif;
        background: var(--c2-body);
        min-height: 100dvh;
      }

      /* Brand bar — AppShell.Header: brand-7 fill, brand-8 border, 56px +
         safe-area, "Cloudy2" (Mantine size-lg / weight 700) left, controls
         right (pin · theme · avatar placeholders). */
      header {
        height: calc(56px + env(safe-area-inset-top, 0px));
        padding: env(safe-area-inset-top, 0px) 16px 0;
        background: #0d47a1;
        border-bottom: 1px solid #0a3a85;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header h1 {
        font-size: 1.125rem;
        font-weight: 700;
        color: #fff;
      }
      .hdr-ctl {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* Skeleton primitive — Mantine Skeleton (gray-3 / dark-4) with its exact
         pulse (opacity 0.4 → 1, 1500ms linear), reduced-motion guarded. */
      .sk {
        background: var(--c2-sk);
        border-radius: 8px;
        display: block;
      }
      @media (prefers-reduced-motion: no-preference) {
        .sk-pulse {
          animation: c2-pulse 1500ms linear infinite;
        }
        @keyframes c2-pulse {
          0%,
          100% {
            opacity: 0.4;
          }
          50% {
            opacity: 1;
          }
        }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Content column — the app's Stack cancels AppShell's 16px top padding
         and pads below for the fixed bottom nav. */
      main {
        padding: 0 16px calc(32px + 56px + env(safe-area-inset-bottom, 0px)) 16px;
      }
      .stack > * + * {
        margin-top: 12px;
      }

      /* One plain loading block — mirrors dashboard/loading.tsx. */
      .plainbox {
        width: 100%;
        height: min(70dvh, 640px);
      }

      /* Bottom nav (AppShell.Footer): mobile-only, 56px + safe-area. */
      .bnav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: calc(56px + env(safe-area-inset-bottom, 0px));
        padding: 0 8px env(safe-area-inset-bottom, 0px);
        background: var(--c2-body);
        border-top: 1px solid var(--c2-border);
        display: flex;
        align-items: center;
        justify-content: space-around;
      }
      .bnav .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      @media (min-width: 40em) {
        .bnav {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Cloudy2</h1>
      <div class="hdr-ctl" aria-hidden="true">
        <span class="sk sk-pulse" style="width: 26px; height: 26px"></span>
        <span class="sk sk-pulse" style="width: 26px; height: 26px"></span>
        <span
          class="sk sk-pulse"
          style="width: 30px; height: 30px; border-radius: 50%"
        ></span>
      </div>
    </header>
    <div class="sr-only" role="status">Loading Cloudy2…</div>
    <main id="c2-main" aria-hidden="true">
      <div class="stack">
        <span class="sk sk-pulse plainbox" id="c2-box"></span>
      </div>
    </main>
    <div class="bnav" aria-hidden="true">
      <span class="item"><span class="sk sk-pulse" style="width: 24px; height: 24px; border-radius: 6px"></span><span class="sk sk-pulse" style="width: 44px; height: 10px; border-radius: 2px"></span></span>
      <span class="item"><span class="sk sk-pulse" style="width: 24px; height: 24px; border-radius: 6px"></span><span class="sk sk-pulse" style="width: 44px; height: 10px; border-radius: 2px"></span></span>
      <span class="item"><span class="sk sk-pulse" style="width: 24px; height: 24px; border-radius: 6px"></span><span class="sk sk-pulse" style="width: 44px; height: 10px; border-radius: 2px"></span></span>
      <span class="item"><span class="sk sk-pulse" style="width: 24px; height: 24px; border-radius: 6px"></span><span class="sk sk-pulse" style="width: 44px; height: 10px; border-radius: 2px"></span></span>
    </div>
    <!--
      Launch targets the inline script is allowed to resolve to. Mirrors
      BASE_PAGES + SETTINGS_SUBTABS in src/lib/ui/uiState.ts; the drift is
      guarded by src/lib/pwa/launchShell.test.ts, which parses this block and
      compares it against those constants. This list only has to be *safe*, not
      authoritative — /settings/* is still enforced server-side by
      requireAdmin(), so an over-permissive entry costs at most one redirect.
    -->
    <script type="application/json" id="c2-launch-routes">
      [
        "/dashboard",
        "/parade-state",
        "/contacts",
        "/settings/users",
        "/settings/departments",
        "/settings/event-types",
        "/settings/templates",
        "/settings/general",
        "/settings/audit-log"
      ]
    </script>
    <script>
      // The service worker serves this page for EVERY launch (start URL `/`),
      // straight from the precache and with no redirect, so the Android splash
      // lifts on this page's first paint instead of waiting on a serverless
      // cold boot. We then resolve the remembered last page *on the client* —
      // the `cloudy2.ui` cookie is client-owned and readable — and replace, so
      // the launch never costs a server round trip for `/` at all. The
      // document route serves the target's cached copy instantly whenever one
      // exists (any age), so this hand-off is usually a cache hit; when it has
      // to go to the network, this plain loading block is what stays painted
      // for the wait.
      //
      // The redirect is deliberately deferred by two animation frames: the
      // parser can otherwise reach it before the browser has presented a frame,
      // and navigating away pre-paint means the splash never lifts — which is
      // precisely the bug this page exists to fix. Two frames because the first
      // rAF fires *before* the paint it schedules; the second runs after that
      // frame has been presented.
      (function () {
        var DEFAULT_TARGET = "/dashboard";

        function allowedRoutes() {
          try {
            return JSON.parse(document.getElementById("c2-launch-routes").textContent);
          } catch (err) {
            return [];
          }
        }

        // Mirrors fromBase64Url + decodeUiState in src/lib/ui/uiState.ts.
        function readUiState() {
          try {
            var match = /(?:^|;\s*)cloudy2\.ui=([^;]*)/.exec(document.cookie);
            if (!match) return null;
            var b64 = decodeURIComponent(match[1]).replace(/-/g, "+").replace(/_/g, "/");
            while (b64.length % 4 !== 0) b64 += "=";
            var json = new TextDecoder().decode(
              Uint8Array.from(atob(b64), function (ch) {
                return ch.charCodeAt(0);
              }),
            );
            return JSON.parse(json);
          } catch (err) {
            return null;
          }
        }

        var state = readUiState();

        function resolveTarget() {
          var page = state && typeof state.lastPage === "string" ? state.lastPage : null;
          if (!page) return DEFAULT_TARGET;
          // "/settings" alone is a tab group, not a route — send it to the
          // first sub-tab, matching resolveLaunchTarget.
          if (page === "/settings") return "/settings/users";
          return allowedRoutes().indexOf(page) === -1 ? DEFAULT_TARGET : page;
        }

        var target = resolveTarget();
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            location.replace(target);
          });
        });
      })();
    </script>
    <noscript>
      <p style="padding: 24px; text-align: center; color: #b0b0b0">
        Cloudy2 needs JavaScript to load.
        <a href="/dashboard" style="color: #8ca8e2">Continue</a>.
      </p>
    </noscript>
  </body>
</html>
