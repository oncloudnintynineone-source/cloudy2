name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check schema drift
        run: pnpm db:generate && git diff --exit-code -- drizzle/

  migrate:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: db-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

  migrate-preview:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/dev'
    concurrency:
      group: db-migrate-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations (preview DB)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: pnpm db:migrate

  deploy-cloudrun:
    runs-on: ubuntu-latest
    needs: [quality, migrate]
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-cloudrun
      cancel-in-progress: false
    env:
      CLOUD_RUN_REGION: asia-east1
      CLOUD_RUN_SERVICE: cloudy2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CLOUD_RUN_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: >-
            ${{ env.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloudy2/cloudy2:${{ github.sha }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: >-
            ${{ env.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloudy2/cloudy2:${{ github.sha }}
          region: ${{ env.CLOUD_RUN_REGION }}
          allow-unauthenticated: true
          # Request-based billing (CPU throttled, scale-to-zero): 1 vCPU, 1 GiB,
          # concurrency 20, at most 4 instances as a cost guard.
          flags: --cpu=1 --memory=1Gi --concurrency=20 --min-instances=0 --max-instances=4

      # Mirror of the Vercel prod env vars plus NEXTAUTH_URL, whose value is only
      # known after the first deploy. Written via --env-vars-file so values may
      # contain commas/'='; rolls a second revision moments after the first.
      - name: Set service environment variables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}
          GOOGLE_DELEGATE_EMAIL: ${{ secrets.GOOGLE_DELEGATE_EMAIL }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
        run: |
          jq -n \
            --arg db "$DATABASE_URL" \
            --arg sec "$NEXTAUTH_SECRET" \
            --arg gs "$GOOGLE_SERVICE_ACCOUNT_BASE64" \
            --arg gd "$GOOGLE_DELEGATE_EMAIL" \
            --arg sm "$SMTP_URL" \
            --arg ef "$EMAIL_FROM" \
            --arg ad "$ADMIN_INITIAL_PASSWORD" \
            '{DATABASE_URL:$db,NEXTAUTH_SECRET:$sec,GOOGLE_SERVICE_ACCOUNT_BASE64:$gs,GOOGLE_DELEGATE_EMAIL:$gd,SMTP_URL:$sm,EMAIL_FROM:$ef,ADMIN_INITIAL_PASSWORD:$ad}' \
            > /tmp/env.json
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --region "$CLOUD_RUN_REGION" \
            --env-vars-file /tmp/env.json \
            --update-env-vars="NEXTAUTH_URL=${{ steps.deploy.outputs.url }}"
